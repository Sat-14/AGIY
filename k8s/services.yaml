apiVersion: v1
kind: Namespace
metadata:
  name: multi-agent-sales
  labels:
    app.kubernetes.io/part-of: multi-agent-sales
---
apiVersion: v1
kind: Service
metadata:
  name: sales-agent
  namespace: multi-agent-sales
  labels:
    app: sales-agent
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: sales-agent
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-agent
  namespace: multi-agent-sales
  labels:
    app: recommendation-agent
spec:
  type: ClusterIP
  ports:
    - port: 5002
      targetPort: 5002
      protocol: TCP
      name: http
  selector:
    app: recommendation-agent
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-agent
  namespace: multi-agent-sales
  labels:
    app: inventory-agent
spec:
  type: ClusterIP
  ports:
    - port: 5003
      targetPort: 5003
      protocol: TCP
      name: http
  selector:
    app: inventory-agent
---
apiVersion: v1
kind: Service
metadata:
  name: fulfillment-agent
  namespace: multi-agent-sales
  labels:
    app: fulfillment-agent
spec:
  type: ClusterIP
  ports:
    - port: 5001
      targetPort: 5001
      protocol: TCP
      name: http
  selector:
    app: fulfillment-agent
---
apiVersion: v1
kind: Service
metadata:
  name: payment-agent
  namespace: multi-agent-sales
  labels:
    app: payment-agent
spec:
  type: ClusterIP
  ports:
    - port: 5005
      targetPort: 5005
      protocol: TCP
      name: http
  selector:
    app: payment-agent
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-ingress
  namespace: multi-agent-sales
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  rules:
    - host: agents.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sales-agent
                port:
                  number: 8000
          - path: /recommendations
            pathType: Prefix
            backend:
              service:
                name: recommendation-agent
                port:
                  number: 5002
          - path: /inventory
            pathType: Prefix
            backend:
              service:
                name: inventory-agent
                port:
                  number: 5003
